name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 单元测试：验证组件逻辑
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: 格式检查
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化：" && echo "$out"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # -race 是必须的：网关是高并发组件，数据竞争在压力下才显形，
      # 而那时已经在生产上了
      - name: 单元测试（含竞态检测）
        run: go test ./... -race -count=1 -timeout 5m

      - name: 覆盖率
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tail -1

  # OTel 处理器：单独成模块，因此需要单独跑
  #
  # 分开的理由与集成测试相同：collector 的 pdata 会带进一棵庞大的依赖树，
  # 而主模块的卖点之一是零外部依赖。但「单独成模块」在 CI 里最容易变成
  # 「没人跑」——主模块的 go test ./... 根本走不进这个目录，
  # 于是它可以坏上几个月而全绿依旧。
  otel-processor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: otelprocessor/go.sum

      - name: 格式检查
        working-directory: otelprocessor
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化：" && echo "$out"
            exit 1
          fi

      - name: vet
        working-directory: otelprocessor
        run: go vet ./...

      - name: 单元测试（含竞态检测）
        working-directory: otelprocessor
        run: go test ./... -race -count=1 -timeout 5m

  # nerclient：Advanced 模式的模块，同样单独成模块、同样需要单独跑
  #
  # 它带着 gRPC 与 protobuf 的依赖树，正是主模块要挡在外面的东西。
  # 而「单独成模块」在 CI 里最容易变成「没人跑」——主模块的 go test ./...
  # 走不进这个目录。
  nerclient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: nerclient/go.sum

      - name: 格式检查
        working-directory: nerclient
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化：" && echo "$out"
            exit 1
          fi

      - name: vet
        working-directory: nerclient
        run: go vet ./...

      # 需要 Python 分析器的用例会自行跳过；这里只保证编译与不依赖
      # sidecar 的那部分逻辑是绿的
      - name: 单元测试
        working-directory: nerclient
        run: go test ./... -count=1 -timeout 5m

      - name: Advanced 二进制可构建
        working-directory: nerclient
        run: go build -o /tmp/airlock-advanced ./cmd/airlock-agent-advanced

  # 配置自检：验证装配结果
  #
  # 与单元测试的分工：单元测试跑的是组件逻辑，dry-run 跑的是装配结果。
  # 一个拼错的配置键、一个未注入的依赖、一个读不到的密钥，
  # 单元测试全都发现不了——它们只在真实装配时才暴露。
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: 构建
        run: go build -o /tmp/airlock ./cmd/airlock-gateway

      # CI 里没有真实的 Vault/K8s Secret 挂载，用 fixture 顶上。
      # 校验的是「装配流程能否走通」，不是「密钥内容是否正确」。
      - name: 准备密钥 fixture
        run: |
          mkdir -p /tmp/secrets
          echo -n "sk-ci-fixture-not-a-real-key" > /tmp/secrets/vendor-api-key

      # CRD 必须与代码同步。手工同步的 schema 会双向漂移：
      # 加字段忘同步 → APIServer 拒绝合法配置；
      # 删字段忘同步 → APIServer 放行网关不认识的字段。
      - name: CRD 未漂移
        run: |
          /tmp/airlock --print-crd > /tmp/crd.yaml
          if ! diff -u configs/airlockconfig-crd.yaml /tmp/crd.yaml; then
            echo "::error::CRD 与代码不一致，请运行 go run ./cmd/airlock-gateway --print-crd > configs/airlockconfig-crd.yaml"
            exit 1
          fi

      - name: 配置自检
        run: |
          sed 's|^secrets_mount_path:.*|secrets_mount_path: /tmp/secrets|' \
            configs/gateway.yaml > /tmp/ci.yaml
          /tmp/airlock --dry-run -config /tmp/ci.yaml

      - name: 归档自检报告
        if: always()
        run: |
          sed 's|^secrets_mount_path:.*|secrets_mount_path: /tmp/secrets|' \
            configs/gateway.yaml > /tmp/ci.yaml
          /tmp/airlock --dry-run --json -config /tmp/ci.yaml > /tmp/dry-run-report.json || true
          cat /tmp/dry-run-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dry-run-report
          path: /tmp/dry-run-report.json

  # 真实拓扑集成测试（No-Mock）：在容器里拉起真实依赖后拨测
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: test/integration/go.sum

      # 集成测试单独成模块，主模块保持零外部依赖——
      # 网关是安全组件，攻击面越小越好，不该为了测试把
      # 整个 Docker 客户端依赖树拖进生产构建
      # 优雅停机的轨迹测试不需要 Docker（只需子进程 + 本地混沌上游），
      # 单独跑一遍确保它不会因为 Docker 缺失被连带跳过
      # 以下两组不需要 Docker（子进程 + 本地混沌上游即可），
      # 单独跑一遍确保它们不会因为 Docker 缺失被连带跳过
      # 拓扑防腐：仓库里每一处写死的包路径都必须解析得到真实存在的包，
      # 每一个 cmd/ 下的命令都必须被至少一处引用，每一个模块都必须能构建。
      #
      # 放在最前，因为它最快（几秒）且它失败时后面的用例大概率也会失败，
      # 只是失败信息没这么直接——「exit status 1」不会告诉你是哪个路径烂了。
      - name: 拓扑防腐（无需 Docker）
        working-directory: test/integration
        run: go test ./... -count=1 -run 'TestNoDangling|TestEveryCommand|TestEveryModule' -v

      # 二进制的能力自陈必须与实际行为一致。
      # 单元测试各自装配自己的那一份，因此「装配漏了」它们全都发现不了。
      - name: 二进制能力拨测（无需 Docker）
        working-directory: test/integration
        run: go test ./... -count=1 -run 'TestCoreBinary|TestCoreStartup' -v

      # 部署清单与二进制的对齐。清单是 YAML，flag 定义在 Go 里，两者之间
      # 没有任何编译期或测试期的连线——曾经出过一次：清单传了
      # --session-consistency 而 Advanced 二进制没定义它，Pod 以
      # "flag provided but not defined" 崩溃循环，而全部测试都是绿的。
      #
      # 同一组还核对清单引用的镜像在仓库里确实有东西能构建：分析器镜像
      # 曾被清单引用了很久，而它的代码与 Dockerfile 都在仓库外。
      - name: 部署清单对齐（无需 Docker）
        working-directory: test/integration
        run: go test ./... -count=1 -run 'TestManifest' -v

      - name: 五项能力验收（无需 Docker）
        working-directory: test/integration
        run: go test ./... -count=1 -timeout 5m -run 'TestAcceptance' -v

      - name: 优雅停机轨迹测试（无需 Docker）
        working-directory: test/integration
        run: go test ./... -count=1 -timeout 5m -run 'Shutdown' -v

      - name: 真实拓扑集成测试
        working-directory: test/integration
        # REQUIRE_INTEGRATION 把「无 Docker 时跳过」变成「失败」。
        # 本地开发允许跳过，CI 里绝不允许——否则集成测试会因为
        # 一次 runner 配置变更被悄悄绕过，而没人会注意到全绿里少了几项
        env:
          REQUIRE_INTEGRATION: "1"
        run: go test ./... -count=1 -timeout 15m -v

  # PII 分析器（Python）。装模型要几分钟，因此与 Go 侧并行而不是串在后面。
  #
  # 这个 job 之前不存在，因为分析器的代码整个不在版本控制里——
  # 契约 proto/pii/v1/ner.proto 在仓库内，实现在仓库外，
  # 于是「两边遵守同一份契约」只有一边能被 CI 验证。
  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analyzer/requirements.txt

      - name: 安装依赖
        working-directory: analyzer
        run: pip install -r requirements.txt

      # 不装模型也要能跑：分析器的依赖是可选的，测试在模型缺失时跳过而非
      # 失败。先跑一遍无模型的，确认这条降级路径本身没坏——它是 Core 模式
      # 用户实际会走的那条。
      - name: 无模型时的降级路径
        working-directory: analyzer
        run: python -m unittest discover tests -v

      # 锁文件必须与上游实际产物一致。GitHub release 资产是不可变的，
      # 因此不一致只有两种可能：锁写错了，或者上游资产被换了——
      # 后者正是这个校验存在的理由。
      - name: 模型锁未漂移
        run: |
          set -e
          version="$(grep '^SPACY_MODEL_VERSION=' analyzer/models.lock | cut -d= -f2)"
          for m in $(grep -oE '^[a-z]+_core_[a-z]+_[a-z]+' analyzer/models.lock); do
            expected="$(grep "^${m} " analyzer/models.lock | cut -d: -f2)"
            url="https://github.com/explosion/spacy-models/releases/download/${m}-${version}/${m}-${version}-py3-none-any.whl"
            actual="$(curl -sL --fail "$url" | sha256sum | cut -d' ' -f1)"
            if [ "$actual" != "$expected" ]; then
              echo "::error::${m} 的校验和与 analyzer/models.lock 不符"
              echo "  锁里写的 ${expected}"
              echo "  实际下载 ${actual}"
              exit 1
            fi
            echo "${m} ✓"
          done

      - name: 下载中文模型
        run: python -m spacy download zh_core_web_md

      - name: 有模型时的完整测试
        working-directory: analyzer
        run: python -m unittest discover tests -v

      # 真正拉起服务，确认它能在 UDS 上就绪并把 socket 建成 0600。
      # 权限不是可选项：TCP 模式下这道文件权限闸门会静默消失。
      - name: 服务可启动且 socket 权限正确
        working-directory: analyzer
        run: |
          rm -f /tmp/airlock-ner.sock
          python -m pii.service.ner_server --socket /tmp/airlock-ner.sock \
              --models zh=zh_core_web_md &
          for i in $(seq 1 60); do
            [ -S /tmp/airlock-ner.sock ] && break
            sleep 2
          done
          if [ ! -S /tmp/airlock-ner.sock ]; then
            echo "NER 服务未在 120 秒内就绪"; exit 1
          fi
          perm=$(stat -c '%a' /tmp/airlock-ner.sock)
          if [ "$perm" != "600" ]; then
            echo "socket 权限为 $perm，应为 600——任何本地进程都能连上它，"
            echo "而它两端传的是明文 PII"
            exit 1
          fi
          echo "NER 服务就绪，socket 权限 $perm"

      # 镜像必须真的能构建。清单引用它，README 让人 docker build 它，
      # 而在它进版本控制之前，这两句话都无人验证过。
      - name: 分析器镜像可构建
        run: docker build -t airlock-analyzer:ci -f analyzer/Dockerfile analyzer/
