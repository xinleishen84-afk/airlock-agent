# AI 网关配置
#
# 严格解析：任何与本文档字段名对不上的键都会让进程启动失败。
# 用 `gateway --dry-run -config <本文件>` 在部署前验证。

# K8s 会把 Secret 以 tmpfs 挂载到此目录，每个键一个文件。
# 切勿指向 /tmp——那是全局可写的，任何进程都能读。
# K8s mounts Secrets here as tmpfs, one file per key.
# Never point this at /tmp: it is world-writable.
secrets_mount_path: /var/run/secrets/llm
secrets_cache_ttl: 5m
session_ttl: 1h
max_sessions: 100000

targets:
  - name: tier1-cloud-premium
    tier: 1
    base_url: http://127.0.0.1:9001/v1
    model: gemini-2.5-flash
    weight: 100
    credential_key: vendor-api-key

  - name: tier2-local-gpu
    tier: 2
    base_url: http://127.0.0.1:9002/v1
    model: gpt-oss-120b
    weight: 100
    self_hosted: true

rules:
  - name: batch-workloads-offload
    target_tier: 2
    priority: 10
    match_apps:
      - "toolbench-agent"
      - "*-batch"
      - "*-indexer"

  - name: planning-apps-premium
    target_tier: 1
    priority: 20
    match_apps:
      - "planner-agent"
      - "*-orchestrator"

budgets:
  "1": 500.0

breaker:
  failure_threshold: 5
  recovery_timeout: 30s

rate_limit:
  tokens_per_window: 5000000
  window: 1m
  max_concurrent: 512
  reservation_ttl: 10m
  per_subject:
    "acme/toolbench-agent":
      tokens_per_window: 20000000
      window: 1m
      max_concurrent: 2048

pii:
  # 检测器故障时阻断请求而非放行原文——脱敏网关唯一安全的默认值
  fail_closed: true
  always_redact: false
  # 要加载的国家包。必填，没有默认值：默认值只能选定某个本土市场，
  # 对写它的人都对、在别处都静默地错——扫意大利合同的部署会继承
  # 别人的假设，然后报告「零 PII」。GEN 是与国界无关的那部分
  # （邮箱、卡号、IBAN、API 密钥）。
  # Country packs to load. Required, no default: any default would pick a
  # home market and be silently wrong everywhere else. GEN holds what no
  # jurisdiction owns (email, card numbers, IBAN, API keys).
  # 可用 / available: GEN CN US IT DE ES
  jurisdictions: [GEN, CN]
  # 会话一致性声明：必填，没有默认值。
  # 占位符（PHONE_0、PHONE_1……）是按本副本见过的文本顺序分配的递增序号，
  # 因此两个副本对同一会话会给出不同的编号。实测：副本 A 把 13800138000
  # 编成 PHONE_0，副本 B 把 13900139000 也编成 PHONE_0——上游回一句引用
  # PHONE_0 的话，两个副本复原出不同的真实号码，用户会拿到别人的数据，
  # 且不报任何错。客户端每轮重发完整历史时看不出来；长会话一裁剪历史就复现，
  # 也就是说会话越长越容易出事。
  #
  # single-replica   只跑一个副本
  # session-affinity 入口按 session id 做一致性哈希，同一会话恒落同一副本
  #                  （nginx: hash $http_x_session_id consistent；
  #                   Istio: consistentHash.httpHeaderName: x-session-id）
  #
  # Required, no default. Placeholders are per-replica ordinals, so two replicas
  # number the same session differently and a response citing PHONE_0 restores
  # to a different real value on each — silently handing one user another's
  # data. Hidden when clients resend full history; reappears as soon as a long
  # session trims it.
  # 示例取安全的那一边。要改成 session-affinity，入口必须真的按 session id
  # 做一致性哈希——ClusterIP 的轮询和 sessionAffinity: ClientIP 都不算数。
  # The example takes the safe side. Switching to session-affinity requires the
  # ingress to actually hash on the session id.
  session_consistency: single-replica
  # 租户自定义规则目录：工号、资产编号、合同号这类只有你自己知道格式的标识。
  # 每条规则必须自带 samples，加载期跑通才会被接受。
  # Tenant rule directory for identifiers only you define. Every rule ships
  # with samples that must pass at load time.
  tenant_rules_dir: ""
  # 企业主数据名册。正则检测不出人名——不配这个也不接 NER，
  # 姓名类 PII 会完全裸奔。生产环境应从员工/客户主数据导出。
  # Enterprise master-data roster. Regexes cannot find names: without this
  # and without NER, name-class PII is fully exposed. In production this
  # should be exported from your employee/customer master data.
  name_roster: []
  org_roster: []
  disabled_types: ["IP"]
  ner:
    endpoint: http://127.0.0.1:9100/v1/detect
    timeout: 300ms
    cache_ttl: 10m
    cache_size: 4096
    types: ["NAME", "ADDRESS", "ORG"]
    fail_open: false
    failure_threshold: 5
    cooldown: 15s

upstream:
  max_idle_conns_per_host: 512
  response_header_timeout: 1m
  dial_timeout: 5s
  idle_conn_timeout: 1m

gpu:
  probe_interval: 300ms
  kv_elevated: 0.75
  kv_critical: 0.9
  waiting_elevated: 8
  waiting_critical: 32
  prefix_affinity: true
  affinity_load_factor: 1.25
